<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="244" viewBox="0 0 1200 244"
     role="img" aria-labelledby="title description">
  <title id="title">H3 Lite production workflow</title>
  <desc id="description">A four-frame filmstrip showing short-film production. Plan the story and shot list, render each shot, review and rerun where needed, then edit and export the film.</desc>

  <defs>
    <pattern id="perforations" x="32" y="14" width="35.5" height="12" patternUnits="userSpaceOnUse">
      <rect x="8.75" y="2" width="18" height="8" rx="2" fill="#62554a"/>
    </pattern>
    <rect id="frame" x="-139" y="35" width="278" height="174" rx="7"/>
  </defs>

  <rect width="1200" height="244" rx="18" fill="#171514"/>
  <rect x="32" y="14" width="1136" height="12" fill="url(#perforations)"/>
  <rect x="32" y="218" width="1136" height="12" fill="url(#perforations)"/>

  <g text-anchor="middle" font-family="system-ui, 'Segoe UI', sans-serif">
    <g transform="translate(171 0)">
      <use href="#frame" fill="#20302c"/>
      <g fill="none" stroke="#78e0d1" stroke-width="4" stroke-linecap="round">
        <path d="M-31 68h16m16 0h30m-62 14h35m16 0h11m-62 14h9m16 0h37"/>
        <circle cx="-7" cy="68" r="7"/>
        <circle cx="12" cy="82" r="7"/>
        <circle cx="-14" cy="96" r="7"/>
      </g>
      <text y="145" fill="#fff5e8" font-size="36" font-weight="700">Plan</text>
      <text y="181" fill="#b6d3cb" font-size="27">Story + shot list</text>
    </g>

    <g transform="translate(457 0)">
      <use href="#frame" fill="#282624"/>
      <g fill="none" stroke="#f2bb7c" stroke-width="4" stroke-linejoin="round">
        <rect x="-34" y="62" width="58" height="34" rx="4"/>
        <path d="M-24 103h54a4 4 0 0 0 4-4V71M-13 70l15 9-15 9z"/>
      </g>
      <text y="145" fill="#fff5e8" font-size="36" font-weight="700">Generate</text>
      <text y="181" fill="#cdbdad" font-size="27">Render by shot</text>
    </g>

    <g transform="translate(743 0)">
      <use href="#frame" fill="#282624"/>
      <g fill="none" stroke="#f2bb7c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
        <rect x="-34" y="60" width="68" height="44" rx="4"/>
        <path d="M-24 82h9l6-10 8 20 8-16 6 6h11"/>
      </g>
      <text y="145" fill="#fff5e8" font-size="36" font-weight="700">Review</text>
      <text y="181" fill="#cdbdad" font-size="27">Check + retry</text>
    </g>

    <g transform="translate(1029 0)">
      <use href="#frame" fill="#282624"/>
      <g fill="none" stroke="#78e0d1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
        <circle cy="82" r="22"/>
        <path d="m-10 82 7 7 14-15"/>
        <path d="M-34 82h4m60 0h4"/>
      </g>
      <text y="145" fill="#fff5e8" font-size="36" font-weight="700">Edit</text>
      <text y="181" fill="#cdbdad" font-size="27">Cut + export</text>
    </g>
  </g>
</svg>
